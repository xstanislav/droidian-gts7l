name: Build Droidian for gts7l

on:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'tools/**'
  workflow_dispatch:

jobs:
  build:
    # Нативный arm64-раннер GitHub Actions
    runs-on: ubuntu-24.04-arm

    steps:
      # Checkout репозитория (нужен для tools/*.py)
      - name: Checkout repository
        uses: actions/checkout@v4

      # Установка пакетов, необходимых для работы с Android-образами
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            android-sdk-libsparse-utils \
            python3 \
            unzip \
            wget \
            curl \
            jq \
            tar

      - name: Install avbtool from AOSP
        run: |
          wget -q https://android.googlesource.com/platform/external/avb/+archive/refs/heads/main.tar.gz -O - | tar xzf - avbtool.py
          sudo mv avbtool.py /usr/local/bin/avbtool
          sudo chmod +x /usr/local/bin/avbtool

      # Получение ссылки на последний nightly-образ Droidian
      - name: Get latest Droidian nightly rootfs URL
        id: droidian
        run: |
          URL=$(curl -sL "https://api.github.com/repos/droidian-images/droidian/releases" \
            | jq -r '.[] | select(.tag_name == "nightly") | .assets[] | select(.name | contains("droidian-OFFICIAL-phosh-phone-rootfs-api30-arm64-next")) | .browser_download_url' \
            | head -n1)
          if [ -z "$URL" ]; then
            echo "::error::Не удалось найти nightly-образ Droidian"
            exit 1
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Скачиваем: $URL"

      # Скачивание образа
      - name: Download Droidian rootfs
        run: |
          wget -q "${{ steps.droidian.outputs.url }}" -O droidian-rootfs.zip

      # Распаковка образа во временную папку
      - name: Extract Droidian rootfs
        run: |
          mkdir -p droidian-extracted
          unzip -q droidian-rootfs.zip -d droidian-extracted
          ls -lh droidian-extracted/data/
          mv droidian-extracted/data/rootfs.img rootfs.img

      # Расширение rootfs
      - name: Resize rootfs image
        run: |
          truncate -s +2G rootfs.img
          sudo e2fsck -f -y rootfs.img
          sudo resize2fs rootfs.img

      # Монтирование raw-образа
      - name: Mount rootfs
        run: |
          sudo mkdir -p /mnt/rootfs
          sudo mount -o loop rootfs.img /mnt/rootfs
          sudo mount -t proc /proc /mnt/rootfs/proc
          sudo mount -t sysfs /sys /mnt/rootfs/sys
          sudo mount --bind /dev /mnt/rootfs/dev
          sudo mount --bind /dev/pts /mnt/rootfs/dev/pts
          sudo touch /mnt/rootfs/etc/resolv.conf
          sudo mount --bind /etc/resolv.conf /mnt/rootfs/etc/resolv.conf

      # Добавление sources.list.d/droidian-port.list
      - name: Add Droidian port APT source
        run: |
          sudo tee /mnt/rootfs/etc/apt/sources.list.d/droidian-port.list > /dev/null <<'EOF'
          deb [trusted=yes] https://xstanislav.github.io/kernel_samsung_sm8250_gts7l/ ./
          deb [trusted=yes] https://xstanislav.github.io/adaptation-samsung-gts7l/ ./
          EOF

      # Установка adaptation-пакетов внутри rootfs
      - name: Install adaptation packages inside rootfs
        run: |
          sudo chroot /mnt/rootfs /bin/bash -c "
            set -e
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              adaptation-samsung-gts7l \
              adaptation-samsung-gts7l-configs
            apt-get clean
            rm -rf /var/lib/apt/lists/*
          "

      # Размонтирование rootfs
      - name: Unmount rootfs
        if: always()
        run: |
          sudo umount /mnt/rootfs/dev/pts
          sudo umount /mnt/rootfs/dev
          sudo umount /mnt/rootfs/sys
          sudo umount /mnt/rootfs/proc
          sudo umount /mnt/rootfs
          sudo umount /mnt/rootfs/etc/resolv.conf

      # Сжатие rootfs.img в zip
      - name: Compress rootfs.img to zip
        run: |
          zip -1 rootfs.img.zip rootfs.img
          ls -lh rootfs.img.zip
          df -h

      # Получение ссылки на последний linux-bootimage .deb
      - name: Get latest kernel bootimage URL
        id: kernel
        run: |
          URL=$(curl -sL "https://api.github.com/repos/xstanislav/kernel_samsung_sm8250_gts7l/releases" \
            | jq -r '.[] | .assets[] | select(.name | contains("linux-bootimage-4.19-325-samsung-gts7l")) | .browser_download_url' \
            | head -n1)
          if [ -z "$URL" ]; then
            echo "::error::Не удалось найти linux-bootimage deb"
            exit 1
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Скачиваем: $URL"

      - name: Download kernel bootimage deb
        run: |
          wget -q "${{ steps.kernel.outputs.url }}" -O linux-bootimage.deb

      # Распаковка .deb
      - name: Extract kernel deb
        run: |
          mkdir -p kernel-extracted
          cd kernel-extracted
          ar x ../linux-bootimage.deb
          tar xf data.tar.*
          ls -lh boot/

      # Сборка boot-tab.img и dtbo-tab.img
      - name: Build boot-tab.img and dtbo-tab.img
        run: |
          BOOT_SRC=$(ls kernel-extracted/boot/boot.img-*)
          DTBO_SRC=$(ls kernel-extracted/boot/dtbo.img-*)
          python3 tools/build-bootimg.py "$BOOT_SRC" boot-tab.img
          python3 tools/make-touchpad-dtbo.py "$DTBO_SRC" dtbo-tab.img
          ls -lh boot-tab.img dtbo-tab.img

      # Загрузка артефактов
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: droidian-gts7l-images
          path: |
            rootfs.img.zip
            boot-tab.img
            dtbo-tab.img
          retention-days: 30

      # Создание GitHub Release
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ github.run_number }}
          name: "Droidian gts7l nightly #${{ github.run_number }}"
          body: |
            Автоматическая сборка Droidian для Samsung Galaxy Tab S7 LTE (gts7l).
            - rootfs.img.zip: собран из последнего nightly-образа Droidian с добавленными adaptation-пакетами
            - boot-tab.img: Samsung-совместимый boot-образ
            - dtbo-tab.img: dtbo с исправленной ориентацией тачпада Book Cover
          files: |
            rootfs.img.zip
            boot-tab.img
            dtbo-tab.img
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
